services:
  central-aggregator:
    build: .
    container_name: eurovision20-central-aggregator
    command: ["python", "central_aggregator.py"]
    ports:
      - "8501:8501"
    volumes:
      - ./results:/app/results
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/health').read()"]
      interval: 5s
      timeout: 3s
      retries: 20

  dc-sweden:
    build: .
    container_name: eurovision20-dc-sweden
    command: ["python", "datacenter_worker.py", "--serve"]
    environment:
      - DATACENTER=dc-sweden
      - CENTRAL_URL=http://central-aggregator:8501
      - WORKER_PORT=9000
    depends_on:
      central-aggregator:
        condition: service_healthy

