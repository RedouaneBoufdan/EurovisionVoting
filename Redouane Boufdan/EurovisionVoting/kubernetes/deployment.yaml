apiVersion: apps/v1
kind: Deployment
metadata:
  name: eurovision-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eurovision-dashboard
  template:
    metadata:
      labels:
        app: eurovision-dashboard
    spec:
      containers:
        - name: dashboard
          image: eurovision-voting:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          volumeMounts:
            - name: results-storage
              mountPath: /app/results
      volumes:
        - name: results-storage
          persistentVolumeClaim:
            claimName: eurovision-results-pvc
